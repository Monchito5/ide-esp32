[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azul-backend"
version = "1.0.0"
description = "Modulo Azul (Menu Lateral y Panel Log) para el IDE ESP32."
requires-python = ">=3.11"

dependencies = []

[tool.setuptools]
packages = ["azul_backend"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
testpaths = ["pruebas"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
