[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sketch-backend"
version = "1.0.0"
description = "Modulo Sketch para compilacion de proyectos ESP32 mediante ESP-IDF."
requires-python = ">=3.11"

# Las dependencias externas se centralizan en requirements.txt de la raiz.
dependencies = []

[tool.setuptools]
packages = ["sketch_backend", "sketch_backend.controllers"]
package-dir = {"" = "."}

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
known_first_party = ["sketch_backend", "ide_core"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
