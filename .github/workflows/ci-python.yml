# Archivo: .github/workflows/ci-python.yml
# CI para Python (core + todos los modulos) con umbral de cobertura >= 70%.

name: CI - Python (Monorepo)

on:
  push:
    branches: [main, develop]
    paths:
      - 'core/backend/**'
      - 'modules/**/backend/**'
      - 'requirements*.txt'
      - '.github/workflows/ci-python.yml'
  pull_request:
    branches: [main, develop]

jobs:
  validacion:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias de desarrollo y produccion (RAIZ)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Instalar core y todos los modulos (editable)
        run: |
          pip install -e core/backend
          pip install -e modules/herramientas/backend
          pip install -e modules/archivo/backend
          pip install -e modules/editor/backend
          pip install -e modules/sketch/backend
          pip install -e modules/simulacion/backend
          pip install -e modules/menu-log/backend

      - name: Verificar ausencia de __init__.py (PEP 420)
        run: |
          python -c "import pathlib; ign = {'venv', '.venv', '.git', 'build', 'dist', '.pytest_cache'}; matches = [p for p in pathlib.Path('.').rglob('__init__.py') if not any(i in p.parts for i in ign)]; print(matches); exit(1 if matches else 0)"

      - name: Formato (black)
        run: black --check core/backend modules/herramientas/backend modules/editor/backend

      - name: Imports (isort)
        run: isort --check-only core/backend modules/herramientas/backend modules/editor/backend

      - name: Pruebas core
        working-directory: core/backend
        run: pytest pruebas/ -v

      - name: Pruebas modulo herramientas
        working-directory: modules/herramientas/backend
        run: pytest pruebas/ -v

      - name: Pruebas modulo archivo
        working-directory: modules/archivo/backend
        run: pytest pruebas/ -v

      - name: Pruebas modulo editor
        working-directory: modules/editor/backend
        run: pytest pruebas/ -v

      - name: Pruebas modulo sketch
        working-directory: modules/sketch/backend
        run: pytest pruebas/ -v

      - name: Pruebas modulo menu-log
        working-directory: modules/menu-log/backend
        run: pytest pruebas/ -v

      - name: Pruebas modulo simulacion
        working-directory: modules/simulacion/backend
        run: pytest pruebas/ -v

      - name: Cobertura global backend (>= 70%)
        run: |
          pytest core/backend/pruebas modules/herramientas/backend/pruebas modules/archivo/backend/pruebas modules/editor/backend/pruebas modules/sketch/backend/pruebas modules/menu-log/backend/pruebas modules/simulacion/backend/pruebas --cov=ide_core --cov=herramientas_backend --cov=archivo_backend --cov=editor_backend --cov=sketch_backend --cov=menu_log_backend --cov=simulacion_backend --cov-fail-under=70
