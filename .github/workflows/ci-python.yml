# Archivo: .github/workflows/ci-python.yml
# CI para Python (core + modulos). Dependencias centralizadas en la raiz.

name: CI - Python (Monorepo)

on:
  push:
    branches: [main, develop]
    paths:
      - 'core/backend/**'
      - 'modules/**/backend/**'
      - 'requirements*.txt'
      - '.github/workflows/ci-python.yml'
  pull_request:
    branches: [main, develop]

jobs:
  validacion:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias de desarrollo y produccion (RAIZ)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Instalar core y modulo herramientas (editable)
        run: |
          pip install -e core/backend
          pip install -e modules/herramientas/backend

      - name: Verificar ausencia de __init__.py
        run: |
          python -c "import pathlib; ign = {'venv', '.venv', '.git', 'build', 'dist', '.pytest_cache'}; matches = [p for p in pathlib.Path('.').rglob('__init__.py') if not any(i in p.parts for i in ign)]; print(matches); exit(1 if matches else 0)"

      - name: Formato (black)
        run: black --check core/backend modules/herramientas/backend

      - name: Imports (isort)
        run: isort --check-only core/backend modules/herramientas/backend

      - name: Pruebas core
        working-directory: core/backend
        run: pytest pruebas/ -v

      - name: Pruebas modulo herramientas
        working-directory: modules/herramientas/backend
        run: pytest pruebas/ -v
