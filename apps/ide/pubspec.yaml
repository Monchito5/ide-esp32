name: ide_app
description: Shell principal del IDE ESP32 (punto de entrada multiplataforma).
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  ide_core:
    path: ../../core/frontend
  herramientas_ui:
    path: ../../modules/herramientas/frontend
  editor_ui:
    path: ../../modules/editor/frontend

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/iconos/
    - assets/imagenes/